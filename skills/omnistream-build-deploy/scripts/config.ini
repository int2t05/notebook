# OmniStream 三仓库编译·部署·测试 任务定义
# 路径/身份真源 = AGENTS.md(§5 Shell 变量块)。本文件不再含 [remote]/[paths]。
# 任务命令集中在 [exec] 段(task_<name>=<命令>,多行用 \ 续行),全部用 $VAR 引用路径(路径无关)。
# 执行: agent 从 AGENTS.md 读 host/user + §5 变量,按下述模板 ssh 跑。
# 代码同步由 VSCode SFTP 自动完成(本地改→保存→同步到远端),本配置不含同步。

# ============ 执行模板(agent 必遵)============
# agent 运行任一 task 前,从 AGENTS.md §5 取变量值,拼成:
#   ssh <REMOTE_USER>@<REMOTE_HOST> 'export OMNI_CODE_ROOT=<v> OMNISTREAM_DIR=<v> OMNIADAPTOR_DIR=<v> \
#     OMNIOPERATOR_DIR=<v> FLINK_HOME=<v> OMNI_HOME=<v> DEPLOY_DIR=<v> INSTALL_SCRIPT_DIR=<v>; \
#     source /etc/profile; <task_命令>'
# (export 在 source /etc/profile 前;OMNI_CODE_ROOT 等自定义变量不被 /etc/profile 覆盖,持久到 task 命令。)
# 简单任务亦可直接 ssh 单引号包裹;复杂任务(status/test_native 含管道/$())同样单引号包裹。

[ssh]
verbose=false

[exec]
verbose=false
keep_alive=false
command=source /etc/profile && echo ready

# ============ 状态 ============
task_status=source /etc/profile; \
echo "=== libtnel.so ==="; ls -la --time-style=long-iso $OMNISTREAM_DIR/cpp/build/jni/libtnel.so /usr/local/lib/libtnel.so 2>/dev/null; \
echo "=== OmniOperator so ==="; ls $OMNI_HOME/lib/libboostkit-omniop-*.so 2>/dev/null; \
echo "=== OmniAdaptor jar ==="; ls $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/java/target/flink-tnel-0.1-SNAPSHOT.jar $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/omni-table-planner/target/omni-table-planer-0.1-SNAPSHOT.jar 2>/dev/null; \
echo "=== $DEPLOY_DIR ==="; ls $DEPLOY_DIR/ 2>/dev/null || echo "NOT-EXIST"; \
echo "=== flink procs ==="; ps -ef | grep -iE "TaskManagerRunner|StandaloneSession" | grep -v grep | wc -l; \
echo "=== parent-first ==="; grep -E "^classloader.resolve-order" $FLINK_HOME/conf/flink-conf.yaml 2>/dev/null || echo "NOT-SET"

# ============ 编译:OmniStream ============
# 增量(保留 build,只重编改动文件 + 重链 libtnel.so)
# 通用化:make tnel 只编 libtnel.so 目标(不编 tneltest,绕过 upstream vector_helper 重构链接失败;不 make install,deploy 直接从 build/jni 拷,避免无 install bulk 时卡死)
# export HOME=$OMNI_CODE_ROOT 修 reconfigure 路径(CMakeLists else 分支 OMNIRUNTIME_SRC_DIR=$HOME,源码在 $OMNIOPERATOR_DIR)
task_omnistream_incr=source /etc/profile; export HOME=$OMNI_CODE_ROOT; \
cd $OMNISTREAM_DIR/cpp/build && make tnel -j$(nproc) && \
echo OMNISTREAM_INCR_OK && ls -la --time-style=long-iso $OMNISTREAM_DIR/cpp/build/jni/libtnel.so

# 全量(rm -rf build,cmake 配置变更/彻底清理时用)
task_omnistream_rebuild=source /etc/profile; bash $INSTALL_SCRIPT_DIR/rebuild_omnistream_vec.sh Release; \
echo "=== build log tail ==="; tail -8 /tmp/omnistream_build.log; \
ls -la --time-style=long-iso $OMNISTREAM_DIR/cpp/build/jni/libtnel.so

# ============ 编译:OmniAdaptor ============
# 增量(推荐):mvn package 不带 clean → Maven 增量 compile, 无改动 ~2s
task_adaptor_incr=source /etc/profile; \
cd $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/omni-flink-bundle && \
mvn package -DskipTests -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true && \
echo ADAPTOR_INCR_OK && ls -la --time-style=long-iso $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/java/target/flink-tnel-0.1-SNAPSHOT.jar $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/omni-table-planner/target/omni-table-planer-0.1-SNAPSHOT.jar
# 全量:mvn clean package(清 target 重编)
task_adaptor_build=source /etc/profile; \
cd $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/omni-flink-bundle && \
mvn clean package -DskipTests -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true && \
echo ADAPTOR_OK && ls -la $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/java/target/flink-tnel-0.1-SNAPSHOT.jar $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/omni-table-planner/target/omni-table-planer-0.1-SNAPSHOT.jar

# ============ 编译:OmniOperator ============
# 增量(推荐):cd build && cmake --build, 不 clean, 无改动 ~0.4s(前提:build 目录存在; 首次需 operator_build 全量建一次)
task_operator_incr=source /etc/profile; \
cd $OMNIOPERATOR_DIR/build && cmake --build . -j$(nproc) && cmake --install . && \
echo OPERATOR_INCR_OK && ls -la --time-style=long-iso $OMNI_HOME/lib/libboostkit-omniop-*.so
# 全量:build.sh release:java(--clean-first 清 build 重编, 20-40min)
task_operator_build=source /etc/profile; \
cd $OMNIOPERATOR_DIR && bash build_scripts/build.sh release:java && \
echo OPERATOR_OK && ls -la $OMNI_HOME/lib/libboostkit-omniop-*.so

# 单测:构建 omtest(EXCLUDE_TEST 默认 OFF → 测试默认构建)+ 跑全量 gtest
# 指定用例: 自定义命令加 --gtest_filter='XxxTest.*' (如 LeftTest.*:RightTest.*)
# HOME=$OMNI_CODE_ROOT 共享 ccache 缓存($OMNI_CODE_ROOT/.ccache)
task_operator_test=source /etc/profile; export HOME=$OMNI_CODE_ROOT; \
cd $OMNIOPERATOR_DIR && \
cmake --build build --target omtest -j$(nproc) && \
echo "=== omtest (all; filter via --gtest_filter='XxxTest.*') ===" && \
build/core/test/omtest 2>&1 | tail -20

# ============ 部署 ============
# 重建 $DEPLOY_DIR(全 so + flink-tnel.jar),逐项 cp -f 容错
task_deploy=source /etc/profile; mkdir -p $DEPLOY_DIR; \
cp -f $OMNISTREAM_DIR/cpp/build/jni/libtnel.so $DEPLOY_DIR/; \
cp -f $OMNI_HOME/lib/libboostkit-omniop-*-2.2.0-aarch64.so $DEPLOY_DIR/; \
cp -f $OMNI_CODE_ROOT/libboundscheck/lib/libboundscheck.so $DEPLOY_DIR/; \
cp -f /usr/local/lib/libLLVM-15.so $DEPLOY_DIR/; \
cp -f /usr/local/lib64/libxxhash.so.0 $DEPLOY_DIR/; \
cp -f /usr/local/lib/librdkafka.so.1 $DEPLOY_DIR/ 2>/dev/null; \
cp -f /usr/local/lib/librdkafka++.so.1 $DEPLOY_DIR/ 2>/dev/null; \
cp -f /usr/lib64/librocksdb.so.8 $DEPLOY_DIR/ 2>/dev/null; \
cp -f /usr/local/lib/libjemalloc.so.2 $DEPLOY_DIR/ 2>/dev/null; \
cp -f /usr/local/lib64/libsnappy.so.1 $DEPLOY_DIR/ 2>/dev/null; \
cp -f /usr/local/lib64/libre2.so.11 $DEPLOY_DIR/ 2>/dev/null; \
cp -f $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/java/target/flink-tnel-0.1-SNAPSHOT.jar $DEPLOY_DIR/; \
cp -f $OMNIADAPTOR_DIR/omnistream/omniop-flink-extension/omni-table-planner/target/omni-table-planer-0.1-SNAPSHOT.jar $DEPLOY_DIR/; \
cp -n $FLINK_HOME/bin/config.sh $FLINK_HOME/bin/config.sh.bak 2>/dev/null; \
echo DEPLOY_OK && ls -la $DEPLOY_DIR/

# 幂等追加 parent-first(classpath 覆盖 Flink 同名类的必要条件)
task_conf_parent_first=grep -qE "^classloader.resolve-order:[[:space:]]*parent-first" $FLINK_HOME/conf/flink-conf.yaml && echo "already parent-first" || { echo "classloader.resolve-order: parent-first" >> $FLINK_HOME/conf/flink-conf.yaml; echo "added parent-first"; }; \
grep -nE "classloader.resolve-order" $FLINK_HOME/conf/flink-conf.yaml

# ============ 集群控制 ============
task_cluster_stop=source /etc/profile; stop-cluster.sh 2>&1 | tail -3; sleep 2; \
pkill -9 -f taskexecutor 2>/dev/null; pkill -9 -f standalonesession 2>/dev/null; sleep 2; \
echo "remaining: $(ps -ef | grep -iE "TaskManagerRunner|StandaloneSession" | grep -v grep | wc -l)"

task_cluster_start=source /etc/profile; export WRITE_TO_FILE=TRUE; start-cluster.sh 2>&1 | tail -3; sleep 8; \
echo "procs: $(ps -ef | grep -iE "TaskManagerRunner|StandaloneSession" | grep -v grep | wc -l)"

# ============ 测试:native 使能验证(A 类固定使能测试,纯投影,快速 native-only)============
# 前提:/tmp/enable_test.sql 与 /tmp/enable_test.csv 已上传(本地 flink-test/test/enable_test/,见 test.md)
# 提交 SQL + 抓 welcome to native + 读 /tmp/flink_output.txt (不生成服务端报告)
# 完整 native vs vanilla 对比 + 本地富报告: 用 omnistream-expression-test 的 run_local.sh enable_test (见 test.md)
task_test_native=source /etc/profile; export PATH=$FLINK_HOME/bin:$PATH; \
LOG=$(ls -t $FLINK_HOME/log/flink-*-taskexecutor-0-*.out 2>/dev/null | head -1); \
BEFORE=$(grep -c "welcome to native" "$LOG" 2>/dev/null); BEFORE=${BEFORE:-0}; \
rm -f /tmp/flink_output.txt; \
echo "=== submit enable_test.sql (BEFORE welcome=$BEFORE) ==="; \
timeout 120 sql-client.sh -f /tmp/enable_test.sql 2>&1 | grep -iE "Job ID|submitted|error" | head; \
sleep 12; \
AFTER=$(grep -c "welcome to native" "$LOG" 2>/dev/null); AFTER=${AFTER:-0}; \
ROWS=$(wc -l < /tmp/flink_output.txt 2>/dev/null); ROWS=${ROWS:-0}; \
echo "welcome-to-native: BEFORE=$BEFORE AFTER=$AFTER"; \
echo "native-rows: $ROWS"; \
echo "=== native output (/tmp/flink_output.txt) ==="; cat /tmp/flink_output.txt 2>/dev/null
